name: CI/CD Pipeline — Deploy Backend to Oracle VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: 🚀 Deploy Backend to Oracle VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 129.151.149.136 >> ~/.ssh/known_hosts

      - name: Sync Backend Code to VPS
        run: |
          rsync -avz --delete \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude 'venv' \
            backend/app/ ubuntu@129.151.149.136:/home/ubuntu/qaza-backend/app/
          scp backend/requirements.txt ubuntu@129.151.149.136:/home/ubuntu/qaza-backend/

      - name: Update Dependencies & Restart Service
        run: |
          ssh ubuntu@129.151.149.136 "bash -s" << 'EOF'
            cd /home/ubuntu/qaza-backend
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            sudo systemctl restart qaza-backend
            sleep 3
            sudo systemctl is-active --quiet qaza-backend && echo "✅ qaza-backend is running!"
          EOF

      - name: Verify Live Health Endpoint
        run: |
          sleep 4
          curl --fail --retry 3 --retry-delay 2 http://129.151.149.136/health
