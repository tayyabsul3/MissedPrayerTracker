name: CI/CD Pipeline — Deploy Backend (OCI) & Frontend (Vercel)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: Deploy FastAPI Backend to Oracle Cloud Ubuntu VPS
  # ════════════════════════════════════════════════════════════════════════════
  deploy-backend:
    name: 🚀 Deploy Backend to Oracle VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 129.151.149.136 >> ~/.ssh/known_hosts

      - name: Sync Backend Code to VPS
        run: |
          rsync -avz --delete \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude 'venv' \
            backend/app/ ubuntu@129.151.149.136:/home/ubuntu/qaza-backend/app/
          scp backend/requirements.txt ubuntu@129.151.149.136:/home/ubuntu/qaza-backend/

      - name: Update Dependencies & Restart Service
        run: |
          ssh ubuntu@129.151.149.136 "bash -s" << 'EOF'
            cd /home/ubuntu/qaza-backend
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            sudo systemctl restart qaza-backend
            sleep 3
            sudo systemctl is-active --quiet qaza-backend && echo "✅ qaza-backend is running!"
          EOF

      - name: Verify Live Health Endpoint
        run: |
          sleep 4
          curl --fail --retry 3 --retry-delay 2 http://129.151.149.136/health

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: Build & Deploy Vue 3 Frontend to Vercel
  # ════════════════════════════════════════════════════════════════════════════
  deploy-frontend:
    name: ⚡ Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend with Environment Secrets
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://129.151.149.136' }}
          VITE_NEON_AUTH_URL: ${{ secrets.VITE_NEON_AUTH_URL || 'http://129.151.149.136/api/v1/auth' }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY || 'BMke3p14pXo079RPoxs6cwll172pfXiuK5keIzB99cFPIPtlF2cFXO4jnmcTaS9w5BMlzvGVtqFUZdRCh5EE31Q' }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || '230253299719-4gn6bk0s1d4vmgs7pl7r56kt4042dau3.apps.googleusercontent.com' }}
        run: npm run build

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./frontend
